[project]
name = "scouter-power-backend"
version = "0.1.0"
description = "API do Scouter Power: estimativa de 1RM e classificação do nível de força"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
